<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" style="background-color: #F8F9FA; font-family: Arial, sans-serif;">
  <defs>
    <!-- Patrón de cuadrícula de arquitecto -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Fondo cuadriculado -->
  <rect width="100%" height="100%" fill="url(#gridMajor)" />

  <!-- ENCABEZADO DEL PLANO -->
  <rect x="40" y="30" width="720" height="70" fill="#29252A" rx="8" />
  <text x="60" y="65" fill="#FFFFFF" font-size="22" font-weight="bold" letter-spacing="1">YORUMANGA — PLANO ARQUITECTÓNICO 2D (SWEET HOME 3D)</text>
  <text x="60" y="85" fill="#D98655" font-size="13" font-weight="bold">LOCAL COMERCIAL: TIENDA DE MANGAS Y CAFETERÍA DE LECTURA • SUPERFICIE: 120 m² (8.00m x 15.00m)</text>

  <!-- COTAS Y MEDIDAS EXTERIORES -->
  <!-- Cota superior 8.00 m -->
  <line x1="100" y1="125" x2="700" y2="125" stroke="#684563" stroke-width="2" marker-start="dot" marker-end="dot"/>
  <text x="380" y="120" fill="#684563" font-size="14" font-weight="bold">8.00 m</text>
  <!-- Cota lateral 15.00 m -->
  <line x1="75" y1="140" x2="75" y2="1040" stroke="#684563" stroke-width="2" />
  <text x="30" y="600" fill="#684563" font-size="14" font-weight="bold" transform="rotate(-90 45,600)">15.00 m</text>

  <!-- MUROS EXTERIORES (Paredes perimetrales de 30cm) -->
  <rect x="100" y="140" width="600" height="900" fill="#FFFFFF" stroke="#1E293B" stroke-width="10" rx="4" />

  <!-- ================= SECTOR 1: SALÓN DE VENTAS (FRENTE) ================= -->
  <!-- Puerta vidriada de entrada -->
  <rect x="340" y="1035" width="120" height="12" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
  <path d="M 340 1035 Q 400 975 400 975" fill="none" stroke="#0284C7" stroke-dasharray="4" stroke-width="2"/>
  <text x="325" y="1065" fill="#0369A1" font-size="12" font-weight="bold">ACCESO PRINCIPAL (VIDRIADO)</text>

  <!-- Bateas y exhibidores de mangas (Estanterías perimetrales) -->
  <!-- Muro Izquierdo: Estanterías Shounen y Seinen -->
  <rect x="106" y="550" width="40" height="420" fill="#684563" rx="3"/>
  <text x="110" y="780" fill="#FFFFFF" font-size="11" font-weight="bold" transform="rotate(-90 125,780)">ESTANTERÍAS DE MANGA PERIMETRALES (2.20m)</text>

  <!-- Bateas Centrales de Novedades y Ofertas -->
  <rect x="230" y="650" width="140" height="60" fill="#F8E9DD" stroke="#D98655" stroke-width="2" rx="6"/>
  <text x="245" y="685" fill="#B9673E" font-size="12" font-weight="bold">BATEA NOVEDADES ✨</text>

  <rect x="230" y="760" width="140" height="60" fill="#F8E9DD" stroke="#D98655" stroke-width="2" rx="6"/>
  <text x="250" y="795" fill="#B9673E" font-size="12" font-weight="bold">BATEA SEINEN / SHOJO</text>

  <rect x="230" y="870" width="140" height="60" fill="#F8E9DD" stroke="#D98655" stroke-width="2" rx="6"/>
  <text x="260" y="905" fill="#B9673E" font-size="12" font-weight="bold">BATEA OFERTAS 🏷️</text>

  <!-- Pasillo de circulación -->
  <text x="180" y="720" fill="#94A3B8" font-size="11" font-style="italic">Pasillo 1.40m</text>

  <!-- ================= SECTOR 2: MOSTRADOR Y PUNTO DE VENTA (POS) ================= -->
  <path d="M 520 980 L 680 980 L 680 820 L 620 820 L 620 920 L 520 920 Z" fill="#EDE2EA" stroke="#684563" stroke-width="3" />
  <text x="545" y="900" fill="#29252A" font-size="12" font-weight="bold">MOSTRADOR POS / CAJA</text>
  <rect x="635" y="840" width="25" height="25" fill="#29252A" rx="4"/>
  <text x="640" y="857" fill="#FFFFFF" font-size="9">POS</text>
  <text x="535" y="955" fill="#68616A" font-size="10">Atención al público y cobro</text>

  <!-- ================= SECTOR 3: CAFETERÍA DE LECTURA ================= -->
  <!-- Línea divisoria semi-abierta -->
  <line x1="105" y1="500" x2="480" y2="500" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6"/>
  <text x="150" y="490" fill="#64748B" font-size="12" font-weight="bold">SECTOR CAFÉ DE LECTURA (5.00m x 4.00m)</text>

  <!-- Barra de café -->
  <rect x="110" y="360" width="130" height="40" fill="#D98655" rx="4"/>
  <text x="125" y="385" fill="#FFFFFF" font-size="11" font-weight="bold">BARRA DE CAFÉ</text>

  <!-- Mesas y sillas -->
  <circle cx="200" cy="270" r="28" fill="#F8E9DD" stroke="#B9673E" stroke-width="2"/>
  <text x="182" y="275" fill="#29252A" font-size="11" font-weight="bold">MESA 1</text>
  <circle cx="160" cy="270" r="10" fill="#E2E8F0"/>
  <circle cx="240" cy="270" r="10" fill="#E2E8F0"/>
  <circle cx="200" cy="230" r="10" fill="#E2E8F0"/>
  <circle cx="200" cy="310" r="10" fill="#E2E8F0"/>

  <circle cx="340" cy="270" r="28" fill="#F8E9DD" stroke="#B9673E" stroke-width="2"/>
  <text x="322" y="275" fill="#29252A" font-size="11" font-weight="bold">MESA 2</text>
  <circle cx="300" cy="270" r="10" fill="#E2E8F0"/>
  <circle cx="380" cy="270" r="10" fill="#E2E8F0"/>

  <circle cx="270" cy="400" r="28" fill="#F8E9DD" stroke="#B9673E" stroke-width="2"/>
  <text x="252" y="405" fill="#29252A" font-size="11" font-weight="bold">MESA 3</text>

  <!-- ================= SECTOR 4: DEPÓSITO Y LOGÍSTICA ================= -->
  <!-- Pared divisoria de fondo -->
  <line x1="480" y1="145" x2="480" y2="500" stroke="#1E293B" stroke-width="6"/>
  <text x="510" y="175" fill="#1E293B" font-size="14" font-weight="bold">DEPÓSITO / BODEGA</text>
  <text x="510" y="195" fill="#64748B" font-size="11">Control de Stock y Proveedores</text>

  <!-- Estanterías industriales -->
  <rect x="500" y="220" width="180" height="35" fill="#94A3B8" stroke="#475569" stroke-width="1.5" rx="2"/>
  <text x="515" y="242" fill="#FFFFFF" font-size="11" font-weight="bold">ESTANTERÍA METAL A (Ivrea / Panini)</text>

  <rect x="500" y="280" width="180" height="35" fill="#94A3B8" stroke="#475569" stroke-width="1.5" rx="2"/>
  <text x="515" y="302" fill="#FFFFFF" font-size="11" font-weight="bold">ESTANTERÍA METAL B (Ovni / Distrito)</text>

  <rect x="500" y="340" width="180" height="35" fill="#94A3B8" stroke="#475569" stroke-width="1.5" rx="2"/>
  <text x="515" y="362" fill="#FFFFFF" font-size="11" font-weight="bold">MESA DE EMBALAJE Y RECEPCIÓN</text>

  <!-- Puerta de Depósito -->
  <rect x="475" y="420" width="10" height="50" fill="#CBD5E1"/>
  <text x="495" y="445" fill="#475569" font-size="10">Acceso Depósito</text>

  <!-- Baño / Sanitarios -->
  <rect x="610" y="400" width="80" height="90" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="635" y="445" fill="#64748B" font-size="11" font-weight="bold">BAÑO</text>

  <!-- LEYENDA DEL PLANO / RÓTULO -->
  <rect x="100" y="1080" width="600" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="120" y="1105" fill="#29252A" font-size="12" font-weight="bold">ESCALA: 1:50 | NORMATIVA: IRAM - MUNICIPALIDAD DE ECHEVERRÍA</text>
  <text x="120" y="1125" fill="#64748B" font-size="11">DISEÑO Y MAQUETADO: Agustín Hermida &amp; Elías González • 7° 3°</text>
  <text x="120" y="1142" fill="#D98655" font-size="10.5" font-weight="bold">SOFTWARE UTILIZADO: Sweet Home 3D v7.2 (Planta 2D y Renderizado Tridimensional)</text>
</svg>
